services:
  # ── FRONTEND (Python / Flask) ──────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyecto_frontend
    restart: unless-stopped

    environment:
      PORT:        ${PORT:-5000}
      DEBUG:       ${DEBUG:-False}
      BACKEND_URL: http://proyecto_backend:3000
      SECRET_KEY:  ${SECRET_KEY}

    ports:
      - "${PORT:-5000}:5000"

    networks:
      - proyecto_net

networks:
  # Se une a la red ya creada por el backend — NO la crea de nuevo
  proyecto_net:
    external: true



    